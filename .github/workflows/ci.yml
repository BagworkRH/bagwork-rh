name: CI

on:
  push:
    # This repository's default branch is `main`.
    branches: [main, develop]
  pull_request:

jobs:
  backend:
    name: Backend (lint + tests)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements/dev.txt
          npm --prefix ../frontend ci
          npm --prefix ../contracts/src/reward_token ci

      - name: Contract tests
        working-directory: contracts/src/reward_token
        run: npx hardhat test

      - name: Hardhat compile
        working-directory: contracts/src/reward_token
        run: npx hardhat compile

      - name: Ruff lint
        run: ruff check apps config tests

      - name: Django system check
        env:
          DEBUG: "1"
        run: python manage.py check

      - name: Hardening checks reject unsafe production settings
        env:
          DJANGO_SETTINGS_MODULE: config.settings.prod
          SECRET_KEY: "unsafe-default-key-change-me"
          ALLOWED_HOSTS: "*"
        run: |
          # Deliberately unsafe production config: `check --deploy` MUST fail
          # with the hardening.* ids. If it passes, the Phase 8 safety net is
          # not wired up and a real deploy would boot with a placeholder key.
          if python manage.py check --deploy --verbosity 2 > /tmp/check.txt 2>&1; then
            echo "::error::hardening checks did not fail on unsafe production config"
            cat /tmp/check.txt
            exit 1
          fi
          grep -q "hardening.E001" /tmp/check.txt
          grep -q "hardening.E002" /tmp/check.txt
          grep -q "hardening.W001" /tmp/check.txt
          echo "hardening checks correctly rejected unsafe production config"

      - name: Run tests
        env:
          DEBUG: "1"
        run: python manage.py test tests

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build