[tool.ruff]
target-version = "py310"
line-length = 110
src = ["backend"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "PL"]
ignore = [
    "RUF012",   # mutable class attrs via django fields are normal
]

[tool.ruff.lint.per-file-ignores]
"**/migrations/*.py" = ["E501", "I001", "UP"]
"backend/config/settings/*.py" = ["E501"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"